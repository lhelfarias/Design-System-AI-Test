# Publishes Storybook (the component catalog) to GitHub Pages on every change to main.
# Anyone can open it without installing anything:
#   https://lhelfarias.github.io/Design-System-AI-Test/
# Official GitHub Pages actions; Storybook builds to a static folder (storybook-static).
name: Storybook

on:
  push:
    branches: [main]
    paths:
      - "packages/react/**"
      - "packages/tokens/css/**"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/react/package-lock.json
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/react/storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
